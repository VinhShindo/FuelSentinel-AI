project:
  name: FuelSentinel-AI
  version: 1.0.0

data:
  directory: data
  filename: fuel_data.csv
  page_size_default: 50

features:
  window_size: 5          # số mẫu dùng để tính moving average, rolling std
  regression_window: 10   # số mẫu hồi quy
  fuel_jump_threshold: 2.0  # giọt nhiên liệu tối thiểu để coi là sự kiện
  stop_speed_threshold: 0.5

events:
  confidence_threshold: 0.7

server:
  host: 0.0.0.0
  port: 5000
  debug: true

logging:
  level: INFO
  file: logs/app.log