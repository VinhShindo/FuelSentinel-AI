services:
  fuelsentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: fuelsentinel-ai:local
    env_file:
      - .env
    ports:
      - "${FUEL_SENTINEL_PORT:-5000}:5000"
    volumes:
      - fuelsentinel_logs:/app/data/logs
    restart: unless-stopped
    init: true

volumes:
  fuelsentinel_logs: