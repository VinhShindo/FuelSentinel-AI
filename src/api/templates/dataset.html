{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <div class="page-title-group">
        <div class="eyebrow">Data access</div>
        <h2>Dataset explorer</h2>
        <p>Review the historical telemetry rows that feed the anomaly detection pipeline.</p>
    </div>
    <div class="page-header-actions">
        <span class="status-pill status-pill--info"><i class="bi bi-database"></i> Historical</span>
    </div>
</div>
<div class="table-shell">
    <div class="table-toolbar">
        <h6 class="fw-bold m-0"><i class="bi bi-table me-2"></i> Signal dataset</h6>
        <div>
            <input type="text" id="search-input" class="table-search" placeholder="Search rows..." aria-label="Search rows">
        </div>
    </div>
    <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
        <table class="table table-custom align-middle" id="dataset-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Timestamp</th>
                    <th>Vehicle</th>
                    <th>Fuel</th>
                    <th>Speed</th>
                    <th>Slope</th>
                    <th>Fuel Rate</th>
                    <th>Stop Dur.</th>
                    <th>Confidence</th>
                    <th>Prediction</th>
                </tr>
            </thead>
            <tbody id="dataset-tbody"></tbody>
        </table>
    </div>
    <div class="pagination-container">
        <button class="btn-page" id="btn-dataset-prev" onclick="changeDatasetPage(-1)">Previous</button>
        <span class="page-info" id="dataset-page-info">Page 1 / 1</span>
        <button class="btn-page" id="btn-dataset-next" onclick="changeDatasetPage(1)">Next</button>
    </div>
</div>

<script>
    function formatTimestamp(isoString) {
        if (!isoString) return '--';
        try {
            let cleanStr = isoString.replace('T', ' ').split('.')[0];
            return cleanStr;
        } catch(e) {
            return isoString;
        }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        let allDatasetData = [];
        let filteredData = [];
        let currentDatasetPage = 1;
        const itemsPerDatasetPage = 15;
        let currentCarId = window.currentVehicle || 'Car 2';

        const searchInput = document.getElementById('search-input');

        function renderDatasetTable() {
            const tbody = document.getElementById('dataset-tbody');
            tbody.innerHTML = '';
            
            const start = (currentDatasetPage - 1) * itemsPerDatasetPage;
            const end = start + itemsPerDatasetPage;
            const pageData = filteredData.slice(start, end);

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center text-muted py-4">Không có dữ liệu lịch sử cho xe này.</td></tr>`;
                document.getElementById('dataset-page-info').innerText = 'Page 0 / 0';
                document.getElementById('btn-dataset-prev').disabled = true;
                document.getElementById('btn-dataset-next').disabled = true;
                return;
            }

            pageData.forEach((row, index) => {
                const raw = row.raw;
                const processed = row.processed;
                const badge = processed.Prediction === 'Refuel' ? 'success' : (processed.Prediction === 'Fuel Theft' ? 'danger' : 'secondary');
                const realIndex = start + index + 1;
                tbody.innerHTML += `<tr>
                    <td>${realIndex}</td>
                    <td>${formatTimestamp(raw.Timestamp)}</td>
                    <td><strong>${currentCarId}</strong></td>
                    <td>${raw.Fuel.toFixed(2)} L</td>
                    <td>${raw.Speed.toFixed(2)} km/h</td>
                    <td>${processed.RegressionSlope.toFixed(2)}</td>
                    <td>${processed.FuelRate.toFixed(2)} L/s</td>
                    <td>${processed.StopDuration || 0}s</td>
                    <td>${processed.Confidence > 0 ? processed.Confidence.toFixed(2) + '%' : 'N/A'}</td>
                    <td><span class="badge bg-${badge}">${processed.Prediction}</span></td>
                </tr>`;
            });

            const totalPages = Math.ceil(filteredData.length / itemsPerDatasetPage) || 1;
            document.getElementById('dataset-page-info').innerText = `Page ${currentDatasetPage} / ${totalPages}`;
            document.getElementById('btn-dataset-prev').disabled = currentDatasetPage === 1;
            document.getElementById('btn-dataset-next').disabled = currentDatasetPage === totalPages;
        }

        window.changeDatasetPage = function(delta) {
            const totalPages = Math.ceil(filteredData.length / itemsPerDatasetPage) || 1;
            const newPage = currentDatasetPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentDatasetPage = newPage;
                renderDatasetTable();
            }
        };

        async function loadDataset(carId) {
            if (!carId) return; // Chặn lỗi undefined
            currentCarId = carId;
            try {
                const res = await fetch(`/api/history?car_id=${carId}`);
                const data = await res.json();
                
                allDatasetData = Array.isArray(data) ? data.reverse() : [];
                currentDatasetPage = 1;
                applySearch();
            } catch(e) { 
                console.error("Lỗi fetch dataset:", e); 
                allDatasetData = [];
                applySearch();
            }
        }

        function applySearch() {
            const keyword = searchInput.value.toLowerCase().trim();
            if (!keyword) {
                filteredData = allDatasetData.slice();
            } else {
                filteredData = allDatasetData.filter(row => {
                    const ts = formatTimestamp(row.raw.Timestamp).toLowerCase();
                    const fuel = row.raw.Fuel.toFixed(2);
                    const speed = row.raw.Speed.toFixed(2);
                    const pred = (row.processed.Prediction || '').toLowerCase();
                    return ts.includes(keyword) || fuel.includes(keyword) || speed.includes(keyword) || pred.includes(keyword);
                });
            }
            renderDatasetTable();
        }

        document.addEventListener('vehicleChanged', function(e) {
            loadDataset(e.detail.carId);
        });

        searchInput.addEventListener('input', () => {
            currentDatasetPage = 1;
            applySearch();
        });

        loadDataset(currentCarId);
        // SỬA LỖI: Thêm check carId trước khi gọi interval
        setInterval(() => {
            if (currentCarId) loadDataset(currentCarId);
        }, 3000);
    });
</script>
{% endblock %}
