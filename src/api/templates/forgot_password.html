<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quên mật khẩu - FuelSentinel</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <div class="form-badge">
            SECURITY
        </div>

        <h1>Quên mật khẩu?</h1>

        <p>
            Nhập email đã đăng ký để nhận mã
            xác minh OTP.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Gửi mã OTP
            </button>

        </form>

        <div class="auth-footer">

            <a href="{{ url_for('login') }}">
                ← Quay lại đăng nhập
            </a>

        </div>

    </div>

</div>

</body>

</html>
