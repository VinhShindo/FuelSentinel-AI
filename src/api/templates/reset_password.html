<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đặt lại mật khẩu - FuelSentinel</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <div class="form-badge">
            SECURITY
        </div>

        <h1>Đặt lại mật khẩu</h1>

        <p>
            Tạo mật khẩu mới cho tài khoản
            FuelSentinel của bạn.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="form-group">

                <label for="password">
                    Mật khẩu mới
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="6"
                    placeholder="Ít nhất 6 ký tự"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirm_password">
                    Xác nhận mật khẩu
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="6"
                    placeholder="Nhập lại mật khẩu"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Đặt lại mật khẩu
            </button>

        </form>

    </div>

</div>

</body>

</html>
