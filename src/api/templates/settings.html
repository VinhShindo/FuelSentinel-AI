{% extends 'base.html' %}
{% block content %}
<div class="table-container">
    <h5 class="fw-bold mb-4"><i class="bi bi-gear me-2 text-secondary"></i> Settings</h5>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card p-4">
                <h6 class="fw-bold mb-3">Appearance</h6>
                <div class="d-flex align-items-center justify-content-between border-bottom pb-3">
                    <div>
                        <div class="fw-bold">Dark Mode</div>
                        <div class="small text-muted">Switch theme to dark mode.</div>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="darkModeToggle" onchange="toggleTheme()">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function toggleTheme() {
        const isDark = document.getElementById('darkModeToggle').checked;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : '');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    // Load saved theme
    if (localStorage.getItem('theme') === 'dark') {
        document.getElementById('darkModeToggle').checked = true;
        document.documentElement.setAttribute('data-theme', 'dark');
    }
</script>
{% endblock %}
