# =============================================================================
# Default Configuration - FuelSentinel-AI
# Dùng làm fallback khi không có config cụ thể
# =============================================================================

project: "FuelSentinel-AI"
seed: 42
deterministic: true
device: "auto"

data:
  train_path: "data/splits/train.csv"
  val_path: "data/splits/val.csv"
  test_path: "data/splits/test.csv"
  batch_size: 64
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  min_sequence_length: 2
  fillna_strategy: "median"
  max_seq_len: null

model:
  name: "bilstm"
  input_dim: 4
  hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  bidirectional: true
  feature_dim: 21
  num_classes: 4
  fusion_type: "gate"
  fusion_dim: 256

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 1.0e-5
  optimizer: "adamw"
  scheduler: "cosine"
  scheduler_params:
    T_max: 100
    eta_min: 1.0e-6
  loss: "cross_entropy"
  early_stopping_patience: 15
  early_stopping_min_delta: 0.001
  gradient_clip_val: 1.0
  use_amp: true

logging:
  level: "INFO"
  log_dir: "outputs/logs"
  tensorboard: true
  csv_logger: true

output:
  base_dir: "outputs"
  save_plots: true